<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1 {
            border: 5px solid rgb(23, 5, 5);
            border-radius: 20px;
            position: relative;
            padding: 20px;
            width: 211px;
            height: 300px;
            top: 20px;
            left: 20px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.5);
        }

        .box2 {
            border: 2px solid rgb(7, 1, 1);
            border-radius: 20px;
            padding: 5px;
            position: relative;
            left: -2px;
            top: 4px;
        }

        .box3 {
            border: 2px solid rgb(7, 1, 1);
            border-radius: 20px;
            padding: 5px;
            position: relative;
            left: -2px;
            top: 5px;
        }

        .box4 {
            border: 2px solid rgb(127, 4, 227);
            border-radius: 20px;
            padding: 5px;
            position: relative;
            width: 76px;
            left: 44px;
        }

        div>p {
            position: relative;
            top: -5px;
        }
        div>h2 {
            position: relative;
            left: 9px;
            color: rgb(6, 6, 202);
            text-decoration: underline rgb(6, 6, 202);
        }
    </style>
</head>

<body>
    <div class="box1">
        <img src="Screenshot 2024-09-21 224440.png" alt="Image" style="width: 100%; height: auto;">
        <span class="box3">Dark souls</span>
        <span class="box2">Price: 20$</span>
        <h2>About the game</h2>
        <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Magnam doloremque in beatae!</p>
        <div class="box4">
            <a href="https://example.com" class="btn">Read more</a>
        </div>

    </div>
</body>

</html>
