<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            border: 1px solid black;

        }
        .container {
            height: 90vh;
            width: 95vw;
            position: relative;
            left: 33px;
            background-color:rgba(218, 116, 116, 0.682);
        }

        .box1 {
            height: 50px;
            background-color: rgb(102, 102, 193);
            position:sticky;
        }

        .box2 {
            padding: 260px;
    height: 100px;
    width: 100px;
    display: inline-block;
    left: 27px;
    position: relative;
    background-color: aqua;
        }
        .box3 {
            padding:160px;
            height: 300px;
            width: 300px;
            display: inline-block;
            right:-190px;
            position: relative;
            background-color: aquamarine;
        }
        p{
            border-radius: 100%;
            width:100px;
            height:100px;
            position:sticky;
            background-color: brown;
        }
        .box4 {
            margin-top: 50px;
            height: 50px;
            position:relative;
            border-radius:50px;
            left:100px;
            width:1300px;
             display: flex;
    justify-content: center;
    align-items: center;
        }
        footer{
            width:100vw;
            height:50px;
        }
        
    </style>
</head>

<body>
    <div class="box box1"> </div>
    <div class="box container">
        <div class="box box2"> </div>
        <div class="box box3"> </div>
    </div>
    <p class="box"></p>
    <div class="box box4"> <h1>Hey there</h1></div>
    <footer class="box"></footer>
</body>

</html>
