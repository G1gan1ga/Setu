<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .container{
            background-color: blue;
            height:80vh;
            width:80vh;
            display: flex;
            align-items: end;
        }
        .box{
            position: relative;
            background-color: brown;
            height: 10vh;
            width:10vh;
            border-radius:50px;
            animation:ball 3s linear infinite alternate-reverse ,
             bounce 0.5s ease-out infinite alternate-reverse;
             
            

        }
        @keyframes ball {
            from{
                left: 0%;
            }
            to{
                left:90%;
            }
        }
        @keyframes bounce {
            from{
                bottom: 0%;
            }
            to{
                bottom:50%;
            }
        }
        </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
    </div>
</body>
</html>
